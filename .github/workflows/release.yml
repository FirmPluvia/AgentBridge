name: Starx release
on:
  push:
    tags: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # setup-android@v3 defaults packages to 'tools platform-tools', but Google
      # removed the legacy 'tools' package, so sdkmanager exits 1. Only ask for
      # platform-tools; the next step installs the platform and build-tools.
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # The checkout/upload path does not preserve the gradlew executable bit,
      # so CI would fail with 'Permission denied' without this step.
      - run: chmod +x gradlew
        working-directory: android
      - name: Build unsigned release without signing secrets
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
        working-directory: android
      - name: Verify unsigned release identity
        run: python scripts/verify_android_artifact.py --kind unsigned-release --apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      # Signs with the configured key when all four secrets are set;
      # otherwise falls back to the standard Android debug key.
      # No certificate verification is performed in either mode.
      - name: Sign release (starx if configured, else debug)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python scripts/sign_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBridge-${{ steps.sign.outputs.signing_mode }}-release
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish tag artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "AgentBridge $GITHUB_REF_NAME · ${{ steps.sign.outputs.signing_mode }}" --notes-file docs/RELEASE.md
          fi
      - name: Always remove temporary signing material
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil
          for pattern in ('agentbridge-starx-*', 'agentbridge-debug-*'):
              for path in pathlib.Path(os.environ['RUNNER_TEMP']).glob(pattern):
                  if path.is_dir() and not path.is_symlink():
                      shutil.rmtree(path)
