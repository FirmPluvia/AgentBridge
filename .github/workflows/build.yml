name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -c requirements.lock '.[test]'
      - run: pytest -q --junitxml=reports/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-reports, path: reports/}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      # setup-android@v3 defaults packages to 'tools platform-tools', but Google
      # removed the legacy 'tools' package, so sdkmanager exits 1. Only ask for
      # platform-tools; the next step installs the platform and build-tools.
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # The checkout/upload path does not preserve the gradlew executable bit,
      # so CI would fail with 'Permission denied' without this step.
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      - run: sha256sum android/app/build/outputs/apk/debug/*.apk > android/app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AgentBridge-debug-and-reports
          path: |
            android/app/build/outputs/apk/debug/
            android/app/build/reports/
            android/app/build/test-results/
