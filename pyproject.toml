[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "agentbridge"
version = "0.3.7"
description = "Authenticated Android control SDK, relay and MCP"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "fastapi==0.119.1", "uvicorn[standard]==0.38.0", "mcp==1.20.0", "pydantic==2.12.3", "pydantic-settings==2.11.0", "anyio==4.11.0", "websockets==15.0.1"]
[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
[project.scripts]
agentbridge = "agentbridge.cli:main"
agentbridge-mcp = "agentbridge.mcp_server:main"
[tool.setuptools.packages.find]
where = ["python", "."]
include = ["agentbridge*", "relay*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
